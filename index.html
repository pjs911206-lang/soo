const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidOf = u => String(u?.id || u?.legacyId || u?.name || "").trim();

async function sha256Hex(text){
  const bytes = new TextEncoder().encode(String(text));
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(hash)).map(v=>v.toString(16).padStart(2,"0")).join("");
}
async function internalEmail(legacyId){
  const hash = await sha256Hex(legacyId);
  return `u-${hash.slice(0,32)}@gnp-hse.firebaseapp.com`;
}

function isAdmin(){
  const r = String(currentUser?.role || "");
  return currentUser?.id === "admin" || ["MASTER","ADMIN","HSE","임원"].includes(r);
}
function roleLabel(role){
  return role === "MASTER" ? "Master Access" : (role || "반원");
}
function showToast(message, type="info"){
  const t = $("toast");
  t.textContent = message;
  t.className = `toast px-4 py-3 rounded-xl shadow-xl text-sm font-bold ${type==="error"?"bg-red-600 text-white":type==="ok"?"bg-emerald-600 text-white":"bg-slate-900 text-white"}`;
  t.classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>t.classList.add("hidden"),2300);
}

function updateTopbar(){
  if(!currentUser) return;
  $("userInfo").textContent = `${currentUser.name || currentUser.id} (${currentUser.team || "미지정"})`;
  $("userRole").textContent = roleLabel(currentUser.role);
  $("userAvatar").textContent = String(currentUser.name || currentUser.id || "G").charAt(0);
  $("pageTitle").textContent =
    $("view-ADMIN").classList.contains("active") ? "권한 설정" :
    $("view-AI1").classList.contains("active") ? "안전제안 작성" : "안전제안 관리";
}

function setView(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(name === "ADMIN" ? "view-ADMIN" : `view-${name}`).classList.add("active");
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.remove("active"));
  const btn = document.querySelector(`[data-view="${name}"]`);
  if(btn) btn.classList.add("active");
  $("pageTitle").textContent =
    name==="ADMIN" ? "권한 설정" :
    name==="AI1" ? "안전제안 작성" : "안전제안 관리";
  renderPermissions();
  renderManage();
  closeMobileMenu();
}

function openMobileMenu(){

  $("backdrop").classList.add("open");
}
function closeMobileMenu(){
  $("sidebar").classList.remove("open");
  $("backdrop").classList.remove("open");
}

async function refreshCurrentUser(){
  if(!currentUser) return;
  const snap = await getDoc(doc(db,USERS,currentUser.id));
  if(snap.exists()){
    currentUser = { ...currentUser, ...snap.data(), id: snap.data().legacyId || snap.data().id || currentUser.id };
    updateTopbar();
  }
}

async function login(){
  const id = $("loginId").value.trim();
  const pw = $("loginPw").value;
  if(!id || !pw) return showToast("성명과 비밀번호를 입력해 주세요.","error");

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "불러오는 중...";

  try{
    const email = await internalEmail(id);
    const credential = await signInWithEmailAndPassword(auth,email,pw);
    const profileSnap = await getDoc(doc(db,USERS,credential.user.uid));

    let profile = {};
    if(profileSnap.exists()) profile = profileSnap.data();

    currentUser = {
      id: profile.legacyId || profile.id || id,
      name: profile.name || id,
      pw: pw,
      team: profile.team || "미지정",
      role: profile.role || (id==="admin" ? "MASTER" : "반원"),
      modules: Array.isArray(profile.modules) ? profile.modules : [],
      approvalPermission: !!profile.approvalPermission,
      firebaseUid: credential.user.uid
    };

    $("loginScreen").classList.add("hidden");
    $("appShell").classList.remove("hidden");
    updateTopbar();
    renderSidebar();
    setView("AI1");
    showToast("로그인되었습니다.","ok");
  }catch(error){
    console.error(error);
    showToast(`로그인 실패: ${error?.message || "인증 오류"}`,"error");
  }finally{
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "로그인";
  }
}

window.saveRole = async function(id){
  if(!isAdmin()) return showToast("권한이 없습니다.","error");
  const target = users.find(u=>String(u.id)===String(id));
  if(!target) return;

  const team = $(`team-${id}`)?.value || target.team || "";
  const role = $(`role-${id}`)?.value || target.role || "반원";

  try{
    const matches = await getDocs(collection(db,USERS));
    let docRef = null;

    for(const item of matches.docs){
      const d = item.data() || {};
      const same =
        String(d.legacyId || d.id || d.name || item.id) === String(id);

      if(same){
        docRef = doc(db,USERS,item.id);
        break;
      }
    }

    if(!docRef) docRef = doc(db,USERS,String(id));

    await setDoc(docRef,{
      ...target,
      id:String(id),
      legacyId:String(id),
      team,
      role,
      approvalPermission: !!target.approvalPermission,
      updatedAt:serverTimestamp()
    },{merge:true});

    showToast(`${target.name || id} 권한이 ${role}(으)로 저장되었습니다.`,"ok");
  }catch(error){
    console.error(error);
    showToast(`권한 저장 실패: ${error?.message || error}`,"error");
  }
};

async function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("사진을 읽을 수 없습니다."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("이미지 처리에 실패했습니다."));
      img.onload=()=>{
        const max=620;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",0.60));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindPhotoInput(){
  const input = $("photoInput");
  if(!input || input.dataset.bound==="1") return;
  input.dataset.bound="1";
  input.addEventListener("change",async e=>{
    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const data=await resizeImage(file);
      $("photoPreview").innerHTML=`
        <div class="border rounded-xl p-2 bg-white">
          <img src="${data}" alt="현장 사진">
        </div>`;
      input.dataset.dataUrl=data;
    }catch(error){
      showToast(error.message,"error");
    }
  });
}

async function saveProposal(){
  const row={
    id:editingId || `AI-${Date.now()}`,
    date:new Date().toLocaleDateString("ko-KR"),
    author:$("proposalAuthor").value.trim() || currentUser?.name || "미입력",
    authorId:currentUser?.id || $("proposalAuthor").value.trim() || "",
    site:$("proposalSite").value || "1공장",
    location:$("proposalLocation").value.trim(),
    type:$("proposalType").value,
    risk:$("proposalRisk").value.trim(),
    current:$("proposalCurrent").value.trim(),
    description:$("proposalCurrent").value.trim(),
    immediate:$("proposalImmediate").value.trim(),
    measure:$("proposalMeasure").value.trim(),
    effect:$("proposalEffect").value.trim(),
    status: editingId ? (proposals.find(p=>p.id===editingId)?.status || "검토대기") : "검토대기",
    approvalStatus: editingId ? (proposals.find(p=>p.id===editingId)?.approvalStatus || "미결재") : "미결재",
    photoDataUrl:$("photoInput").dataset.dataUrl || (editingId ? (proposals.find(p=>p.id===editingId)?.photoDataUrl || "") : ""),
    improvementPhotoDataUrl:editingId ? (proposals.find(p=>p.id===editingId)?.improvementPhotoDataUrl || "") : "",
    scores:editingId ? (proposals.find(p=>p.id===editingId)?.scores || null) : null
  };

  if(!row.location) return showToast("장소 / 설비명을 입력해 주세요.","error");
  if(!row.current) return showToast("현재 현황 / 발견 내용을 입력해 주세요.","error");
  if(!row.type) return showToast("위험유형을 선택해 주세요.","error");
  if(!row.risk) return showToast("예상 위험을 입력해 주세요.","error");
  if(!row.immediate) return showToast("즉시조치를 입력해 주세요.","error");
  if(!row.measure) return showToast("개선대책을 입력해 주세요.","error");
  if(!row.effect) return showToast("기대효과를 입력해 주세요.","error");

  try{
    await setDoc(doc(db,PROPOSALS,row.id),{
      ...row,
      createdBy: row.authorId,
      updatedBy: currentUser?.id || "",
      updatedAt:serverTimestamp()
    },{merge:true});

    showToast(editingId ? "안전제안이 수정되었습니다." : "안전제안이 저장되었습니다.","ok");
    resetProposalForm();
    setView("MANAGE");
  }catch(error){
    console.error(error);
    showToast(`저장 실패: ${error?.message || error}`,"error");
  }
}

function renderManage(){
  if(!$("manageList")) return;

  const sorted=[...proposals].sort((a,b)=>{
    const ta=a.updatedAt?.seconds || 0, tb=b.updatedAt?.seconds || 0;
    return tb-ta || String(b.id).localeCompare(String(a.id));
  });

  $("manageCount").textContent=`${sorted.length}건`;

  if(!sorted.length){
    $("manageList").innerHTML=`
      <div class="p-12 text-center text-slate-500">
        <div class="text-4xl mb-3">📋</div>
        <div class="font-bold">등록된 안전제안이 없습니다.</div>
      </div>`;
    return;
  }

  $("manageList").innerHTML=sorted.map(item=>`
    <article class="p-5 border-b last:border-b-0">
      <div class="flex gap-5 manage-row">
        ${item.photoDataUrl ? `
          <div class="w-full md:w-44 shrink-0">
            <img src="${item.photoDataUrl}" alt="현장 사진" class="w-full h-32 object-cover rounded-xl border">
          </div>` : ""}
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-2">
            <span class="text-xs font-black text-blue-700">${esc(item.type||"기타")}</span>
            <span class="text-xs text-slate-400">${esc(item.site||"사업장 미입력")}</span>
            <span class="text-xs text-slate-400">${esc(item.date||"")}</span>
            <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 text-[11px] font-black">${esc(item.status||"검토대기")}</span>
            <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-[11px] font-black">${esc(item.approvalStatus||"미결재")}</span>
          </div>
          <h3 class="text-lg font-black">${esc(item.location||"장소 미입력")}</h3>
          <p class="text-sm text-slate-600 mt-2 line-clamp-2">${esc(item.current||"")}</p>
          <div class="text-xs text-slate-400 mt-3">작성자: ${esc(item.author||"미입력")}</div>
        </div>
        <div class="flex md:flex-col gap-2 md:w-28 shrink-0">
          <button class="btn flex-1 bg-blue-700 text-white rounded-lg px-3 py-2 text-xs font-black"
                  onclick="window.openDetail('${esc(item.id)}')">상세보기</button>
          ${isAdmin() ? `
            <button class="btn flex-1 border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold"
                    onclick="window.editProposal('${esc(item.id)}')">수정</button>
            <button class="btn flex-1 border border-red-200 text-red-600 bg-red-50 rounded-lg px-3 py-2 text-xs font-bold"
                    onclick="window.deleteProposal('${esc(item.id)}')">삭제</button>` : ""}
        </div>
      </div>
    </article>
  `).join("");
}

window.editProposal=function(id){
  const item=proposals.find(p=>String(p.id)===String(id));
  if(!item) return;
  editingId=item.id;
  $("proposalAuthor").value=item.author||"";
  $("proposalSite").value=item.site||"1공장";
  $("proposalLocation").value=item.location||"";
  $("proposalType").value=item.type||"";
  $("proposalRisk").value=item.risk||"";
  $("proposalCurrent").value=item.current||"";
  $("proposalImmediate").value=item.immediate||"";
  $("proposalMeasure").value=item.measure||"";
  $("proposalEffect").value=item.effect||"";
  $("photoInput").value="";
  if(item.photoDataUrl){
    $("photoInput").dataset.dataUrl=item.photoDataUrl;
    $("photoPreview").innerHTML=`<div class="border rounded-xl p-2 bg-white"><img src="${item.photoDataUrl}" alt="현장 사진"></div>`;
  }else{
    delete $("photoInput").dataset.dataUrl;
    $("photoPreview").innerHTML="";
  }
  $("proposalSaveBtn").textContent="수정 내용 저장";
  setView("AI1");
};

window.deleteProposal=async function(id){
  if(!isAdmin()) return showToast("관리자 권한이 필요합니다.","error");
  const item=proposals.find(p=>String(p.id)===String(id));
  if(!item) return;
  if(!confirm(`'${item.location || item.id}' 안전제안을 삭제하시겠습니까?`)) return;
  try{
    await deleteDoc(doc(db,PROPOSALS,String(id)));
    showToast("삭제되었습니다.","ok");
  }catch(error){
    console.error(error);
    showToast(`삭제 실패: ${error?.message || error}`,"error");
  }
};

window.openDetail=function(id){
  const item=proposals.find(p=>String(p.id)===String(id));
  if(!item) return;
  detailId=id;

  $("detailBody").innerHTML=`
    <div class="space-y-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-[11px] text-slate-400">유형</div><div class="font-black mt-1">${esc(item.type||"-")}</div></div>
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-[11px] text-slate-400">사업장</div><div class="font-black mt-1">${esc(item.site||"-")}</div></div>
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-[11px] text-slate-400">상태</div><div class="font-black mt-1">${esc(item.status||"검토대기")}</div></div>
        <div class="bg-slate-50 rounded-xl p-3"><div class="text-[11px] text-slate-400">결재</div><div class="font-black mt-1">${esc(item.approvalStatus||"미결재")}</div></div>
      </div>
      <div><div class="text-xs font-black text-slate-500">장소 / 설비</div><div class="text-lg font-black mt-1">${esc(item.location||"-")}</div></div>
      <div><div class="text-xs font-black text-slate-500">예상 위험</div><div class="mt-1 whitespace-pre-wrap">${esc(item.risk||"-")}</div></div>
      <div><div class="text-xs font-black text-slate-500">현재 현황</div><div class="mt-1 whitespace-pre-wrap">${esc(item.current||"-")}</div></div>
      <div class="bg-amber-50 border border-amber-100 rounded-xl p-4"><div class="text-xs font-black text-amber-700">즉시조치</div><div class="mt-1 whitespace-pre-wrap">${esc(item.immediate||"-")}</div></div>
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4"><div class="text-xs font-black text-indigo-700">개선대책</div><div class="mt-1 whitespace-pre-wrap">${esc(item.measure||"-")}</div></div>
      <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4"><div class="text-xs font-black text-emerald-700">기대효과</div><div class="mt-1 whitespace-pre-wrap">${esc(item.effect||"-")}</div></div>
      ${item.photoDataUrl?`<div><div class="text-xs font-black text-slate-500 mb-2">현장사진</div><img src="${item.photoDataUrl}" class="max-h-72 rounded-xl border mx-auto object-contain"></div>`:""}
      ${isAdmin()?`
        <div class="border-t pt-4 grid grid-cols-1 md:grid-cols-3 gap-3">
          <div><label class="text-xs font-bold text-slate-500">상태변경</label>
            <select id="detailStatus" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
              ${["검토대기","조치중","조치완료","반려"].map(s=>`<option ${String(item.status||"검토대기")===s?"selected":""}>${s}</option>`).join("")}
            </select>
          </div>
          <div><label class="text-xs font-bold text-slate-500">결재상태</label>
            <select id="detailApproval" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
              ${["미결재","결재대기","결재완료","반려"].map(s=>`<option ${String(item.approvalStatus||"미결재")===s?"selected":""}>${s}</option>`).join("")}
            </select>
          </div>
          <div class="flex items-end"><button onclick="window.saveDetailState()" class="w-full bg-blue-700 text-white rounded-lg px-4 py-2.5 text-sm font-black">상태 저장</button></div>
        </div>`:""}
    </div>`;
  $("detailModal").classList.add("open");
};

window.saveDetailState=async function(){
  if(!detailId || !isAdmin()) return;
  const item=proposals.find(p=>String(p.id)===String(detailId));
  if(!item) return;
  try{
    await setDoc(doc(db,PROPOSALS,String(detailId)),{
      status:$("detailStatus").value,
      approvalStatus:$("detailApproval").value,
      updatedBy:currentUser?.id||"",
      updatedAt:serverTimestamp()
    },{merge:true});
    showToast("상태/결재가 저장되었습니다.","ok");
    $("detailModal").classList.remove("open");
  }catch(error){
    showToast(`저장 실패: ${error?.message || error}`,"error");
  }
};

function startRealtime(){
  if(usersUnsub) usersUnsub();
  if(proposalsUnsub) proposalsUnsub();

  usersUnsub=onSnapshot(collection(db,USERS),snap=>{
    if($("syncDot")) $("syncDot").className="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0";
    users=snap.docs.map(d=>({
      ...(d.data()||{}),
      id:String(d.data()?.legacyId || d.data()?.id || d.id)
    })).filter(u=>uidOf(u));
    renderPermissions();
    refreshCurrentUser().catch(()=>{});
  },error=>{
    if($("syncDot")) $("syncDot").className="w-2.5 h-2.5 rounded-full bg-red-500 shrink-0";
    console.error("[users realtime]",error);
  });

  proposalsUnsub=onSnapshot(collection(db,PROPOSALS),snap=>{
    if($("syncDot")) $("syncDot").className="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0";
    proposals=snap.docs.map(d=>({
      ...(d.data()||{}),
      id:String(d.data()?.id || d.id)
    })).filter(p=>pidOf(p));
    renderManage();
  },error=>{
    if($("syncDot")) $("syncDot").className="w-2.5 h-2.5 rounded-full bg-red-500 shrink-0";
    console.error("[proposals realtime]",error);
  });
}

window.addEventListener("load",()=>{
  $("loginId")?.addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
  $("loginPw")?.addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
  bindPhotoInput();
  startRealtime();
  resetProposalForm();
});

window.login=login;
window.guest=guest;
window.logout=logout;
window.openCreate=openCreate;
window.saveProposal=saveProposal;
window.setView=setView;
window.openMobileMenu=openMobileMenu;
window.closeMobileMenu=closeMobileMenu;

</script>
</head>

<body>
<div id="loginScreen" class="fixed inset-0 z-[5000] gnp-blue flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-[420px] rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-7">
      <div class="text-3xl font-black text-slate-800 tracking-tight">GNP HSE</div>
      <div class="text-xs text-slate-400 mt-2 tracking-[.18em]">FIRESTORE SAFETY SYSTEM</div>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-500">성명 (ID)</label>
        <input id="loginId" class="w-full border rounded-xl px-4 py-3 mt-1 outline-none focus:ring-2 focus:ring-blue-200" placeholder="성명 입력">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500">비밀번호</label>
        <input id="loginPw" type="password" class="w-full border rounded-xl px-4 py-3 mt-1 outline-none focus:ring-2 focus:ring-blue-200" placeholder="비밀번호 입력">
      </div>
      <button id="loginBtn" onclick="login()" class="btn w-full gnp-blue text-white rounded-xl py-3.5 font-black">로그인</button>
      <button onclick="guest()" class="btn w-full border-2 border-blue-900 text-blue-900 rounded-xl py-3 font-black">Guest 로그인</button>
      <p class="text-center text-[11px] text-slate-400">로그인/권한/안전제안 데이터는 Firestore를 공용 원본으로 사용합니다.</p>
    </div>
  </div>
</div>

<div id="appShell" class="hidden h-screen flex overflow-hidden">
  <aside id="sidebar" class="w-64 gnp-blue text-white flex flex-col shadow-2xl shrink-0">
    <div class="p-6 border-b border-blue-800">
      <div class="text-lg font-black leading-tight">지앤피 안전제안</div>
      <div class="text-[9px] text-blue-300 mt-1 tracking-[.2em]">FIRESTORE MODE</div>
    </div>
    <nav class="flex-1 p-3 space-y-2 overflow-y-auto">
      <button data-view="AI1" onclick="setView('AI1')" class="sidebarBtn active w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-blue-800">
        <i class="fas fa-pen mr-2"></i>안전제안 작성
      </button>
      <button data-view="MANAGE" onclick="setView('MANAGE')" class="sidebarBtn w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-blue-800">
        <i class="fas fa-list-check mr-2"></i>안전제안 관리
      </button>
      <button id="navAdmin" data-view="ADMIN" onclick="setView('ADMIN')" class="sidebarBtn w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-blue-800 hidden">
        <i class="fas fa-user-shield mr-2"></i>권한 설정
      </button>
    </nav>
    <div class="p-4 border-t border-blue-800">
      <button onclick="logout()" class="w-full text-blue-200 text-xs font-bold hover:text-white">
        <i class="fas fa-power-off mr-1"></i> 로그아웃
      </button>
    </div>
  </aside>

  <div id="backdrop" onclick="closeMobileMenu()"></div>
  <button id="menuBtn" onclick="openMobileMenu()" class="hidden fixed left-3 top-3 z-[2500] w-10 h-10 bg-white border rounded-xl items-center justify-center shadow">
    <i class="fas fa-bars"></i>
  </button>

  <main id="main" class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header id="topbar" class="bg-white border-b flex items-center justify-between px-8 shrink-0">
      <h2 id="pageTitle" class="text-xl font-black text-slate-800">안전제안 작성</h2>
      <div class="flex items-center gap-2">
        <div class="border-l pl-3 text-right">
          <div id="userInfo" class="text-xs font-bold text-slate-700">-</div>
          <div id="userRole" class="text-[9px] text-blue-600 font-black">-</div>
        </div>
        <div id="syncDot" title="Firestore 실시간 연결" class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></div>
        <div id="userAvatar" class="rounded-full gnp-blue text-white flex items-center justify-center font-black">G</div>
      </div>
    </header>

    <div id="content" class="flex-1 overflow-y-auto p-6 bg-slate-50">
      <section id="view-AI1" class="view active">
        <div class="mb-5 bg-gradient-to-r from-indigo-950 to-blue-800 rounded-2xl p-6 text-white">
          <div class="text-xs font-black tracking-[.2em] text-blue-200">SAFETY PROPOSAL</div>
          <div class="text-2xl font-black mt-1">안전제안 작성</div>
          <div class="text-sm text-blue-100 mt-2">현장 위험요인을 등록하고 개선대책과 기대효과를 작성합니다.</div>
        </div>

        <div class="bg-white border rounded-2xl shadow-sm p-5">
          <div id="proposalForm" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label class="text-xs font-bold text-slate-500">작성자</label><input id="proposalAuthor" class="w-full border rounded-lg px-3 py-2.5 mt-1 bg-slate-50"></div>
              <div><label class="text-xs font-bold text-slate-500">사업장</label><select id="proposalSite" class="w-full border rounded-lg px-3 py-2.5 mt-1"><option>1공장</option><option>2공장</option><option>3공장</option></select></div>
            </div>
            <div><label class="text-xs font-bold text-slate-500">장소 / 설비명</label><input id="proposalLocation" class="w-full border rounded-lg px-3 py-2.5 mt-1" placeholder="예: 압출기 3호기 주변"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label class="text-xs font-bold text-slate-500">위험유형</label>
                <select id="proposalType" class="w-full border rounded-lg px-3 py-2.5 mt-1">
                  <option value="">선택</option>
                  <option>추락</option><option>전도</option><option>충돌</option><option>낙하/비래</option><option>감김/끼임</option><option>절단</option><option>감전</option><option>화재/폭발</option><option>중독/질식</option><option>무리한동작</option><option>기타</option>
                </select>
              </div>
              <div><label class="text-xs font-bold text-slate-500">예상 위험</label><input id="proposalRisk" class="w-full border rounded-lg px-3 py-2.5 mt-1" placeholder="예: 끼임, 충돌 등"></div>
            </div>
            <div><label class="text-xs font-bold text-slate-500">현재 현황 / 발견 내용</label><textarea id="proposalCurrent" rows="4" class="w-full border rounded-lg px-3 py-2.5 mt-1"></textarea></div>
            <div class="bg-slate-50 rounded-xl p-4 border">
              <div class="text-sm font-black text-slate-700 mb-3">현장사진</div>
              <div class="grid grid-cols-3 gap-2">
                <label class="btn h-10 rounded-lg border bg-blue-50 text-blue-700 flex items-center justify-center text-xs font-black cursor-pointer">
                  <i class="fas fa-paperclip mr-1"></i>첨부하기
                  <input id="photoInput" type="file" accept="image/*" class="hidden">
                </label>
                <label class="btn h-10 rounded-lg border bg-emerald-50 text-emerald-700 flex items-center justify-center text-xs font-black cursor-pointer">
                  <i class="fas fa-camera mr-1"></i>사진찍기
                  <input type="file" accept="image/*" capture="environment" class="hidden" onchange="document.getElementById('photoInput').files=this.files; document.getElementById('photoInput').dispatchEvent(new Event('change',{bubbles:true}))">
                </label>
                <button type="button" onclick="showToast('현재 사진을 편집하려면 기기 편집 기능을 이용해 주세요.')" class="btn h-10 rounded-lg border bg-violet-50 text-violet-700 text-xs font-black">
                  <i class="fas fa-sliders mr-1"></i>편집하기
                </button>
              </div>
              <div id="photoPreview" class="photo-preview mt-3"></div>
            </div>
            <div><label class="text-xs font-bold text-slate-500">즉시조치</label><textarea id="proposalImmediate" rows="3" class="w-full border rounded-lg px-3 py-2.5 mt-1"></textarea></div>
            <div><label class="text-xs font-bold text-slate-500">개선대책</label><textarea id="proposalMeasure" rows="4" class="w-full border rounded-lg px-3 py-2.5 mt-1"></textarea></div>
            <div><label class="text-xs font-bold text-slate-500">기대효과</label><textarea id="proposalEffect" rows="3" class="w-full border rounded-lg px-3 py-2.5 mt-1"></textarea></div>
            <div class="flex flex-col sm:flex-row justify-end gap-2 pt-2">
              <button type="button" onclick="resetProposalForm()" class="px-4 py-2.5 border rounded-lg text-sm font-bold">초기화</button>
              <button id="proposalSaveBtn" type="button" onclick="saveProposal()" class="px-5 py-2.5 bg-emerald-600 text-white rounded-lg text-sm font-black">안전제안 저장</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-MANAGE" class="view">
        <div class="bg-white border rounded-2xl shadow-sm p-5 mb-5 flex items-center justify-between">
          <div>
            <div class="text-lg font-black">안전제안 관리</div>
            <div class="text-xs text-slate-500 mt-1">Firestore에 저장된 동일한 안전제안을 PC와 모바일에서 함께 확인합니다.</div>
          </div>
          <div id="manageCount" class="px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 text-xs font-black">0건</div>
        </div>
        <div id="manageList" class="bg-white border rounded-2xl shadow-sm overflow-hidden"></div>
      </section>

      <section id="view-ADMIN" class="view">
        <div class="bg-white border rounded-2xl shadow-sm">
          <div class="p-5 border-b">
            <div class="text-lg font-black">사용자 권한 설정</div>
            <div class="text-xs text-slate-500 mt-1">권한과 팀은 Firestore의 users 컬렉션을 기준으로 즉시 공유됩니다.</div>
          </div>
          <div id="permissionList"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="detailModal" class="modal fixed inset-0 z-[4000] bg-black/50 items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
    <div class="px-5 py-4 border-b flex items-center justify-between">
      <div class="text-lg font-black">안전제안 상세보기</div>
      <button onclick="$('detailModal').classList.remove('open')" class="text-slate-400 hover:text-slate-700"><i class="fas fa-times text-xl"></i></button>
    </div>
    <div id="detailBody" class="p-5 overflow-y-auto"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>
</body>
</html>
